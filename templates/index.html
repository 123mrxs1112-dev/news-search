<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>핵심 뉴스 검색기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .search-box input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #38bdf8;
    }

    .search-box button {
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .search-box button:hover { opacity: 0.85; }
    .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
      min-height: 22px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #38bdf8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 16px;
      transition: transform 0.15s, border-color 0.2s;
    }

    .result-card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .source-badge {
      font-size: 0.75rem;
      background: #0f172a;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .score-badge {
      font-size: 0.75rem;
      background: linear-gradient(135deg, #38bdf855, #818cf855);
      color: #818cf8;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .card-title a {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f1f5f9;
      text-decoration: none;
      line-height: 1.5;
    }

    .card-title a:hover { color: #38bdf8; }

    .card-desc {
      margin-top: 8px;
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.6;
    }

    .card-date {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #475569;
    }

    .error-msg {
      text-align: center;
      color: #f87171;
      background: #1e293b;
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 16px;
    }

    .empty-msg {
      text-align: center;
      color: #94a3b8;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📰 핵심 뉴스 검색기</h1>
      <p>단어를 입력하면 관련성 높은 뉴스 기사만 골라드립니다</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="검색어를 입력하세요 (예: 인공지능, 삼성전자...)" />
      <button id="searchBtn" onclick="doSearch()">검색</button>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const input = document.getElementById('searchInput');
    const btn = document.getElementById('searchBtn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    async function doSearch() {
      const keyword = input.value.trim();
      if (!keyword) return;

      btn.disabled = true;
      resultsEl.innerHTML = '';
      statusEl.innerHTML = '<span class="spinner"></span> 뉴스를 검색하고 있습니다...';

      try {
        const res = await fetch('/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keyword })
        });
        const data = await res.json();

        if (data.error) {
          resultsEl.innerHTML = `<div class="error-msg">⚠️ ${data.error}</div>`;
          statusEl.innerHTML = '';
          return;
        }

        if (data.results.length === 0) {
          resultsEl.innerHTML = `<div class="empty-msg">😥 "${keyword}" 관련 뉴스를 찾지 못했습니다.</div>`;
          statusEl.innerHTML = '';
          return;
        }

        statusEl.innerHTML = `✅ <strong>"${data.keyword}"</strong> 관련 기사 ${data.total}건 중 상위 ${data.results.length}건을 표시합니다`;

        resultsEl.innerHTML = data.results.map(item => `
          <div class="result-card">
            <div class="card-top">
              <span class="source-badge">📌 ${item.source}</span>
              <span class="score-badge">관련도 ${item.score}점</span>
            </div>
            <div class="card-title">
              <a href="${item.link}" target="_blank">${item.title}</a>
            </div>
            ${item.description ? `<div class="card-desc">${item.description}</div>` : ''}
            <div class="card-date">🕐 ${item.pub_date}</div>
          </div>
        `).join('');

      } catch (err) {
        resultsEl.innerHTML = `<div class="error-msg">⚠️ 서버 연결 오류가 발생했습니다. app.py가 실행 중인지 확인해주세요.</div>`;
        statusEl.innerHTML = '';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
